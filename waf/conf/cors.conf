more_set_headers -s 403 'Content-Type: text/html';
more_set_headers -s 403 'Access-Control-Allow-Origin: *';
more_set_headers -s 403 'Access-Control-Max-Age: 3600';
more_set_headers -s 403 'Access-Control-Allow-Methods: GET, POST, PUT, DELETE, OPTIONS';
more_set_headers 'Access-Control-Allow-Headers: *';

# Stage 7 FIX — defesa em profundidade contra DOM XSS via fragmento.
# O WAF não vê o payload (está no fragmento #), mas manda o NAVEGADOR recusar
# executar script inline. Neutraliza o XSS client-side sem precisar inspecionar o payload.
more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self'; object-src 'none'";
