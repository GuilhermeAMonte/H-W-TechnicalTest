# docker-compose.yml — Lab Red+Blue (H&W)
# CASCA (Stage 0). Serviços entram nas stages 1→4. Não subir ainda.
#
# Topologia de rede (fiel ao diagrama do case):
#   - wg-gateway conecta-se às 3 redes e é o ÚNICO roteador entre elas
#     (nftables default-deny no FORWARD). Redes 'internal: true' NÃO têm
#     rota pra internet nem entre si sem passar pelo gateway.
#   - Cada segmento é uma rede docker isolada /24.
#
# NOTA: a isolação real vem do nftables no gateway (Stage 1), não só das
# redes docker. Docker por padrão permite forward entre redes — por isso
# o container-roteador existe. Ver specs/01-architecture.md.

networks:
  # Rede de BORDA (não-internal): interface "internet-facing" do gateway.
  # Só por aqui entra a VPN (51820/udp publicado). Os segmentos NÃO tocam nela.
  edge:
    name: lab_edge
    ipam:
      config:
        - subnet: 172.31.0.0/24
  dmz:
    name: lab_dmz
    internal: true
    ipam:
      config:
        - subnet: 172.30.10.0/24
  app:
    name: lab_app
    internal: true
    ipam:
      config:
        - subnet: 172.30.20.0/24
  db:
    name: lab_db
    internal: true
    ipam:
      config:
        - subnet: 172.30.30.0/24

services:
  # === netfix — libera o trânsito inter-lab na camada do Docker (host netns) ===
  # O firewall do próprio Docker derruba o forward inter-segmento antes de chegar no
  # wg-gateway. Este one-shot insere um ACCEPT em DOCKER-USER só pro range do lab;
  # o filtro fino (F1/F2/default-deny) continua sendo do nftables no wg-gateway.
  netfix:
    image: lab-gateway
    build: ./gateway
    network_mode: host          # entra no netns do host (a VM do Docker Desktop)
    cap_add:
      - NET_ADMIN
    privileged: true            # necessário pra mexer no iptables do host
    volumes:
      - ./gateway/docker-user-fix.sh:/docker-user-fix.sh:ro
    entrypoint: ["/bin/sh", "/docker-user-fix.sh"]
    restart: "no"

  # === wg-gateway (Stage 1/2) — roteador + firewall + entrada VPN ===
  wg-gateway:
    build: ./gateway
    image: lab-gateway
    container_name: wg-gateway
    hostname: wg-gateway
    # NET_ADMIN: permite ao container escrever regras nftables no netfilter do kernel.
    cap_add:
      - NET_ADMIN
    # ip_forward=1: habilita o kernel a ROTEAR pacotes entre as 3 redes.
    # Sem isso, pacote de uma rede pra outra é descartado (container não encaminha).
    sysctls:
      - net.ipv4.ip_forward=1
    # Porta do WireGuard publicada no host (entrada da VPN vinda da internet/LAN).
    ports:
      - "51820:51820/udp"
    # /dev/net/tun necessário pro wg-quick criar a interface do túnel.
    devices:
      - /dev/net/tun
    # Bind-mounts: ruleset nftables + chaves/template do WireGuard.
    volumes:
      - ./gateway/nftables:/etc/nftables:ro
      - ./gateway/wireguard:/etc/wireguard-src:ro
      - ./gateway/ssh:/etc/gateway-ssh:ro
    # Multi-homed: borda (edge) + IP fixo .254 em cada segmento.
    networks:
      edge:
        ipv4_address: 172.31.0.2
      dmz:
        ipv4_address: 172.30.10.254
      app:
        ipv4_address: 172.30.20.254
      db:
        ipv4_address: 172.30.30.254

  # === postgres (Stage 3) — DB fechado, dados sensíveis. Só a APP alcança (F2). ===
  postgres:
    build: ./targets/postgres   # postgres:16 + auto-rota no entrypoint (sobrevive a restart)
    image: lab-postgres
    container_name: postgres
    cap_add:
      - NET_ADMIN               # pro entrypoint injetar a rota default
    environment:
      POSTGRES_USER: appuser
      # Senha vem do .env (gitignored) — NÃO commitada. gen-keys.sh gera se faltar.
      # VULN-3 (cred estática, alvo do pivô) segue existindo; só não está no git.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env (rode scripts/gen-keys.sh)}
      POSTGRES_DB: labdb
    volumes:
      - ./targets/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      db:
        ipv4_address: 172.30.30.10
    # SEM 'ports': o banco NUNCA é exposto ao host (regra do jogo).

  # === app-api (Stage 3) — pivô lateral. Guarda a cred do DB. Só a DMZ alcança (F1). ===
  app-api:
    build: ./targets/app-api
    image: lab-app-api
    container_name: app-api
    cap_add:
      - NET_ADMIN            # pro entrypoint injetar a rota default
    environment:
      DB_HOST: 172.30.30.10  # IP do postgres (segmentos diferentes = usa IP, roteia pelo gateway)
      DB_PORT: "5432"
      DB_USER: appuser
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env (rode scripts/gen-keys.sh)}
      DB_NAME: labdb
    networks:
      app:
        ipv4_address: 172.30.20.10
    depends_on:
      - postgres

  # === dvwa (Stage 3) — alvo vulnerável na DMZ. Fica atrás do WAF (Stage 4). ===
  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: dvwa
    networks:
      dmz:
        ipv4_address: 172.30.10.10
    # SEM 'ports': acesso só via WAF/gateway (VPN). Nunca direto do host.

  # Sidecar de rota do DVWA: dá ao host comprometido um GATEWAY PADRÃO (172.30.10.254),
  # como qualquer máquina real tem. Sem isso o container nem consegue TENTAR alcançar
  # outros segmentos ("Network is unreachable"), e a segmentação passaria a depender de
  # "ausência de rota" (frágil/acidental) em vez do firewall. Com a rota, quem decide o
  # movimento lateral DMZ->APP é a regra F1 (decisão explícita), não um acidente de config.
  dvwa-route:
    image: lab-gateway
    network_mode: "service:dvwa"
    cap_add:
      - NET_ADMIN
    entrypoint: ["/bin/sh","-c","ip route replace default via 172.30.10.254 && echo '[route] dvwa default via 172.30.10.254' && sleep infinity"]
    depends_on:
      - dvwa
    restart: unless-stopped

  # === waf (Stage 4) — Nginx + ModSecurity + OWASP CRS na frente do DVWA ===
  # Stage 4: DetectionOnly (loga, não bloqueia). Stage 7: vira On (bloqueia 403).
  waf:
    build: ./waf                        # owasp/modsecurity-crs + CSP no cors.conf (Stage 7 fix)
    image: lab-waf
    container_name: waf
    environment:
      MODSEC_RULE_ENGINE: On              # BLOQUEIA (403) — Stage 7 (era DetectionOnly na Stage 4)
      PARANOIA: "1"                        # nível 1: pega o óbvio, pouco falso-positivo
      BACKEND: "http://dvwa:80"            # reverse proxy pro DVWA (mesmo segmento DMZ)
      PORT: "8080"                         # WAF roda sem privilégio -> porta >1024
      MODSEC_AUDIT_ENGINE: RelevantOnly    # audita só request "interessante" (ataque)
      MODSEC_AUDIT_LOG_FORMAT: JSON        # log de auditoria em JSON (fácil de ler)
    networks:
      dmz:
        ipv4_address: 172.30.10.5
    depends_on:
      - dvwa

  # Sidecar de rota do WAF: a imagem roda como usuário 'nginx' (não-root), então
  # não pode mexer em rota. Este container compartilha o netns do WAF (root +
  # NET_ADMIN) e injeta a rota default via o gateway da DMZ, pro WAF responder
  # ao cliente VPN. restart: unless-stopped => re-injeta se o WAF reiniciar.
  waf-route:
    image: lab-gateway
    network_mode: "service:waf"
    cap_add:
      - NET_ADMIN
    entrypoint: ["/bin/sh","-c","ip route replace default via 172.30.10.254 && echo '[route] waf default via 172.30.10.254' && sleep infinity"]
    depends_on:
      - waf
    restart: unless-stopped
